<style>
    header{background:#fff;box-shadow:0 4px 6px rgba(0,0,0,0.1);color:#225870;position:fixed;top:0;width:100%;height:auto;z-index:99000;}
    .header-limitador{max-width:1190px;height:100px;padding:0;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}

    #logo {height: 70px; width: auto;transition: transform 0.4s ease-in-out;} #logo:hover {cursor: pointer;transform: scale(1.05) translateX(20px);}
    nav ul {list-style: none;display: flex;gap: 30px;padding: 0;margin: 0;}
    nav ul li {padding: 0 18px} /*ul li*/@media(max-width: 1200px){nav ul li {padding: 0 10px;}}/*ul li*/
    nav ul li a{color:#235c76;text-decoration:none;border-radius:2px;font-size:15px;font-weight:800;letter-spacing:2px;transition:0.3s ease-in-out;}
    nav ul li a:hover{background-color:var(--c2);color:#fff;padding:8px;text-decoration:double underline #d3d3d3c0 0.5px;transition:all 0.4s ease-in-out;}
    #contacto-header{background-color:var(--c1);color:#fff;padding:10px 20px;border-radius:8px;transition:background-color 0.4s ease-in-out,color 0.4s ease-in-out,padding 0.2s ease-in-out;}
    #contacto-header:hover{background-color:var(--c2);padding:14px 24px;}

    .menu-icon{display:none;flex-direction:column;cursor:pointer;z-index:99999;}
    .menu-icon span{background:var(--c1);height:4px;width:30px;margin:4px 0;border-radius:10px;transition:0.3s ease;}
    #menu-toggle {display: none;}
    #menu-toggle:checked + .menu-icon span:nth-child(1) {transform: rotate(45deg) translate(9px, 10px);}
    #menu-toggle:checked + .menu-icon span:nth-child(2) {opacity: 0;}
    #menu-toggle:checked + .menu-icon span:nth-child(3) {transform: rotate(-45deg) translate(7px, -8px);}

    @media (max-width: 1150px) {
        header{margin:0;display: flex;} .header-limitador{width: 100%;justify-content: center;gap:20px;}
        nav ul{display:none;flex-direction:column;position:absolute;top:100px;left:0;width:100%;background-color:#fff;box-shadow:0 4px 6px rgba(0,0,0,0.1);border-radius:0 0 12px 12px;text-align:center;padding:0;gap:20px;padding-bottom:20px;}
        nav ul li {padding: 2px 0;} nav ul li a:hover {text-decoration: none;}
        .menu-icon {display: flex;} #menu-toggle:checked + .menu-icon + nav ul {display: flex;}
    }
</style>

<header>
    <div class="header-limitador">
      <div class="logo-contenedor">
        <a href="../index.html">
          <img src="/img/L&H.webp" id="logo" alt="L&H Outsourcing" style="height: 70px; width: auto;"/>
        </a>
      </div>
      <input type="checkbox" id="menu-toggle" />
      <label for="menu-toggle" class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
      </label>
      <nav>
        <ul>
          <li><a href="./index.html#servicios">Servicios</a></li>
          <li><a href="./index.html#testimonios">Testimonios</a></li>
          <li><a href="./index.html#acerca">Acerca de</a></li>
          <li><a href="./index.html#publicaciones">Publicaciones</a></li>
          <li><a href="./index.html#contacto" id="contacto-header">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>
