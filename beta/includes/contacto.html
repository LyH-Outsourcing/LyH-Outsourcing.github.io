<style>
      /* :root {--c1: #2c3e50;--c2: #3498db;--c3: #2980b9;--c4: #e74c3c;--c5: #ecf0f1;} */
  #contacto {
    padding: 20px 0;
    position: relative;
    overflow: hidden;
    padding-bottom: 80px;
  }
  
  #contacto::before {
    content: "";
    position: absolute;
    top: 0px;
    left: -100px;
    width: 300px;
    height: 120px;
    background: var(--c2);
    opacity: 0.3;
    border-radius: 12px;
  }
  
  #contacto::after {
    content: "";
    position: absolute;
    bottom: 120px;
    right: 12px;
    width: 300px;
    height: 300px;
    background: var(--c3);
    opacity: 0.3;
    clip-path: polygon(10% 50%, 30% 70%, 70% 30%, 80% 40%, 30% 90%, 0% 60%);
    border-radius: 50%;
  }
  
  .contacto-container {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }
  
  .contacto-header {
    text-align: center;
    margin-bottom: 60px;
  }
  
  .contacto-titulo {
    font-size: 54px;
    color: var(--c1);
    margin-bottom: 15px;
    position: relative;
    display: inline-block;
  }
  
  .contacto-titulo::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 4px;
    background: var(--c2);
    border-radius: 2px;
  }
  
  .contacto-descripcion {
    font-size: 1.3rem;
    color: var(--c2);
    max-width: 700px;
    margin: 0 auto 30px;
    line-height: 1.6;
  }
  
  .contacto-contenido {
    display: flex;
    flex-wrap: wrap;
    gap: 40px;
    justify-content: center;
    align-items: stretch;
  }
  

  
  /* Tarjeta de información */
  .info-card {
    background: white;
    padding: 32px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    height: 100%;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .info-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
  }
  
  .info-card h3 , .formulario-animado h3{
    font-size: 1.8rem;
    color: var(--c1);
    position: relative;
    padding: 10px 0;
    margin:0;
  }
  
  .info-card h3::after , .formulario-animado h3::after{
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 50px;
    height: 3px;
    background: var(--c2);
    border-radius: 3px;
  }
  
  .info-item {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    margin: 25px 0;
  }
  
  .info-icon {
    width: 40px;
    height: 40px;
    background: rgba(52, 152, 219, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  
  .info-icon svg {
    width: 20px;
    height: 20px;
    color: var(--c2);
  }
  
  .info-label {
    font-size: 0.9rem;
    color: #777;
    margin-bottom: 3px;
  }
  
  .info-value {
    font-size: 1.1rem;
    color: #333;
    font-weight: 500;
  }
  
  .contacto-redes {
    margin-top: 40px;
  }
  
  .contacto-redes h4 {
    font-size: 1.3rem;
    color: var(--c1);
    margin-bottom: 15px;
  }
  
  .redes-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .contacto-red {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 15px;
    border-radius: 50px;
    font-size: 0.9rem;
    color: #fff;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
  }
  
  .contacto-red svg {
    width: 16px;
    height: 16px;
  }
  
  .social-whatsapp {
    background-color: #25d366;
  }
  
  .social-whatsapp:hover {
    background-color: #1da851;
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3);
  }
  
  .social-facebook {
    background-color: #3b5998;
  }
  
  .social-facebook:hover {
    background-color: #2d4373;
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(59, 89, 152, 0.3);
  }
  
  .social-instagram {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  }
  
  .social-instagram:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(220, 39, 67, 0.3);
  }


  .contacto-formulario, .contacto-info {
    flex: 1 1 400px;
    max-width: 500px;
  }
  
  /* Formulario mejorado */
  .formulario-animado {
    background: white;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .formulario-animado:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
  }
  
  .contacto-campo {
    margin-bottom: 30px;
    position: relative;
  }
  
  .contacto-campo input,
  .contacto-campo textarea {
    width: 100%;
    padding: 15px 0 5px 0;
    border: none;
    border-bottom: 1px solid #ccc;
    font-size: 1rem;
    background: transparent;
    transition: all 0.3s ease;
  }
  
  .contacto-campo textarea {
    resize: none;
    min-height: 80px;
  }
  
  .contacto-campo label {
    position: absolute;
    top: 15px;
    left: 0;
    color: #777;
    transition: all 0.3s ease;
    pointer-events: none;
  }
  
  .contacto-campo .underline {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--c2);
    transition: width 0.4s ease;
  }
  
  .contacto-campo input:focus,
  .contacto-campo textarea:focus {
    outline: none;
    border-bottom-color: transparent;
  }
  
  .contacto-campo input:focus ~ label,
  .contacto-campo input:valid ~ label,
  .contacto-campo textarea:focus ~ label,
  .contacto-campo textarea:valid ~ label {
    top: -5px;
    font-size: 0.8rem;
    color: var(--c2);
  }
  
  .contacto-campo input:focus ~ .underline,
  .contacto-campo textarea:focus ~ .underline {
    width: 100%;
  }
  
  .contacto-boton {
    background: linear-gradient(45deg, var(--c2), var(--c3));
    color: #fff;
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
    overflow: hidden;
    position: relative;
  }
  
  .contacto-boton span {
    position: relative;
    z-index: 2;
  }
  
  .contacto-boton svg {
    width: 24px;
    height: 24px;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
  }
  
  .contacto-boton::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(45deg, var(--c3), var(--c2));
    transition: left 0.4s ease;
    z-index: 1;
  }
  
  .contacto-boton:hover {
    box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4);
  }
  
  .contacto-boton:hover::before {
    left: 0;
  }
  
  .contacto-boton:hover svg {
    transform: translateX(5px);
  }

  
  
  /* Responsive */
  @media (max-width: 768px) {
    .contacto-titulo {
      font-size: 2.5rem;
    }
    
    .contacto-descripcion {
      font-size: 1.1rem;
    }
    
    .contacto-formulario, .contacto-info {
      flex: 1 1 100%;
    }
    
    .info-card {
      padding: 30px 20px;
    }
  }
</style>
